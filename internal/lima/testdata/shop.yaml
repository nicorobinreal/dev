# Generated by dev for instance "shop". Do not edit; dev regenerates it.
minimumLimaVersion: "2.0.0"
vmType: vz
images:
- location: "https://cloud-images.ubuntu.com/releases/resolute/release-20261016/ubuntu-26.04-server-cloudimg-arm64.img"
  arch: aarch64
  digest: "sha256:8eb876c2ccc4b6ff89e4a65d511815923b285e04503ba465809bf587f763da24"
- location: "https://cloud-images.ubuntu.com/releases/resolute/release-20261016/ubuntu-26.04-server-cloudimg-amd64.img"
  arch: x86_64
  digest: "sha256:5645d0318ad21f643ebb1ac4567514620e9893380b07b0201fda163baa5b7eb5"
cpus: 4
memory: "8GiB"
disk: "60GiB"
# No Mac folders are shared into the VM.
mounts: []
mountType: virtiofs
# dev installs Docker Engine itself; skip Lima's containerd/nerdctl.
containerd:
  system: false
  user: false
vmOpts:
  vz:
    rosetta:
      enabled: true
      binfmt: true
# No automatic port forwarding to the Mac: access goes through Tailscale.
# Rules match in order; a 0.0.0.0 guestIP with guestIPMustBeZero=false matches
# any bound address. The explicit loopback/IPv6 rules are belt and braces.
portForwards:
- guestIP: "0.0.0.0"
  guestIPMustBeZero: false
  proto: any
  ignore: true
- guestIP: "127.0.0.1"
  proto: any
  ignore: true
- guestIP: "::"
  guestIPMustBeZero: false
  proto: any
  ignore: true
# Same as Lima's ubuntu-lts template: don't block boot on the NIC rename
# (LP: #2136392).
param:
  internal_netplanOptional: "true"
